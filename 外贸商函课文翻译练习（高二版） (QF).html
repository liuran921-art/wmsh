<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸商函 · 课文翻译练习（高难版）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
  :root {
    --navy: #1a2d4e; --blue: #2c5282; --accent: #c8972a; --accent-light: #f6e8c3;
    --green: #276749; --green-light: #c6f6d5; --red: #9b2c2c; --red-light: #fed7d7;
    --bg: #f7f4ef; --card: #ffffff; --border: #d6d0c8; --text: #1a1a2e; --muted: #6b7280;
    --hint-bg: #fffbeb; --hint-color: #92400e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Serif SC', serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .topbar { background: var(--navy); color: white; padding: 14px 32px; display: flex;
    align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    border-bottom: 3px solid var(--accent); }
  .topbar .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: .04em; }
  .topbar .breadcrumb { font-size: .82rem; color: rgba(255,255,255,.65); display: flex; align-items: center; gap: 6px; }
  .breadcrumb .sep { color: var(--accent); }
  .breadcrumb .crumb { cursor: pointer; transition: color .2s; }
  .breadcrumb .crumb:hover { color: white; }
  .breadcrumb .active { color: white; font-weight: 700; }
  .topbar .home-btn { background: transparent; border: 1px solid rgba(255,255,255,.35); color: white;
    padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: .82rem; font-family: inherit; transition: all .2s; }
  .topbar .home-btn:hover { background: rgba(255,255,255,.15); border-color: white; }

  .main { max-width: 980px; margin: 0 auto; padding: 36px 24px 80px; }

  /* HOME */
  .home-header { text-align: center; margin-bottom: 48px; }
  .home-header h1 { font-size: 2rem; color: var(--navy); margin-bottom: 10px; }
  .home-header p { color: var(--muted); font-size: .95rem; }
  .home-header .badge { display: inline-block; background: var(--accent); color: white;
    font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-top: 8px; }
  .name-section { max-width: 380px; margin: 0 auto 44px; display: flex; gap: 10px; align-items: center; }
  .name-section label { font-weight: 700; white-space: nowrap; color: var(--navy); }
  .name-section input { flex: 1; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
    font-size: 1rem; font-family: inherit; background: white; transition: border-color .2s; }
  .name-section input:focus { outline: none; border-color: var(--blue); }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .project-card { background: white; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 22px 20px 18px; cursor: pointer; transition: all .22s; position: relative; overflow: hidden; }
  .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent); transform: scaleX(0); transition: transform .22s; transform-origin: left; }
  .project-card:hover { border-color: var(--blue); box-shadow: 0 4px 18px rgba(44,82,130,.12); transform: translateY(-2px); }
  .project-card:hover::before { transform: scaleX(1); }
  .project-num { font-size: .78rem; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 6px; }
  .project-name { font-size: 1.02rem; font-weight: 700; color: var(--navy); margin-bottom: 4px; line-height: 1.4; }
  .project-sub { font-size: .84rem; color: var(--muted); }
  .project-count { position: absolute; top: 18px; right: 16px; background: var(--accent-light);
    color: var(--accent); font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }

  /* MODELS */
  .screen-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px;
    padding-bottom: 24px; border-bottom: 1.5px solid var(--border); }
  .back-btn { background: white; border: 1.5px solid var(--border); color: var(--navy); padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: .88rem; font-family: inherit; font-weight: 700;
    transition: all .2s; white-space: nowrap; }
  .back-btn:hover { background: var(--navy); color: white; border-color: var(--navy); }
  .screen-header-text h2 { font-size: 1.6rem; color: var(--navy); margin-bottom: 4px; }
  .screen-header-text p { color: var(--muted); font-size: .9rem; }
  .models-list { display: flex; flex-direction: column; gap: 12px; }
  .model-card { background: white; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 18px 22px; cursor: pointer; transition: all .2s; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; }
  .model-card:hover { border-color: var(--blue); background: #f0f6ff; box-shadow: 0 2px 10px rgba(44,82,130,.08); }
  .model-id { font-weight: 700; color: var(--accent); font-size: 1.05rem; min-width: 52px; }
  .model-title-text { flex: 1; }
  .model-title-zh { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .model-title-en { font-size: .82rem; color: var(--muted); font-style: italic; font-family: 'Lora', serif; }
  .model-score-badge { background: var(--green-light); color: var(--green); font-size: .8rem;
    font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
  .model-arrow { color: var(--border); font-size: 1.2rem; }

  /* EXERCISE */
  .exercise-header { background: var(--navy); color: white; padding: 20px 28px; border-radius: 12px;
    margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .exercise-header .ex-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .exercise-header .ex-meta { font-size: .8rem; color: rgba(255,255,255,.6); }
  .progress-pill { background: var(--accent); color: white; padding: 4px 14px;
    border-radius: 20px; font-size: .8rem; font-weight: 700; white-space: nowrap; }

  /* hint legend */
  .hint-legend { display: flex; gap: 18px; align-items: center; margin-bottom: 18px;
    padding: 10px 16px; background: var(--hint-bg); border: 1px solid #fde68a;
    border-radius: 8px; font-size: .82rem; color: var(--hint-color); }
  .hint-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .legend-hint .dot { background: var(--hint-color); }
  .legend-blank .dot { background: #9ca3af; }

  .sentence-block { background: white; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 20px 24px; margin-bottom: 16px; }
  .zh-hint { font-size: .9rem; color: var(--blue); background: #ebf4ff; border-left: 3px solid var(--blue);
    padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 14px; line-height: 1.7; }

  /* EN text with inline words and blanks */
  .en-text { font-family: 'Lora', serif; font-size: 1.08rem; line-height: 2.6; color: var(--text); }

  /* HINT word shown in amber */
  .hint-word { color: var(--hint-color); font-weight: 700; background: var(--hint-bg);
    padding: 1px 5px; border-radius: 4px; border: 1px solid #fde68a; margin: 0 1px; }

  /* BLANK input */
  .blank { display: inline-block; border: none; border-bottom: 2.5px solid #9ca3af; background: transparent;
    font-family: 'Lora', serif; font-size: 1rem; text-align: center; color: var(--navy); padding: 0 2px 1px;
    margin: 0 1px; vertical-align: baseline; transition: border-color .2s; }
  .blank:focus { outline: none; border-bottom-color: var(--blue); background: rgba(44,82,130,.04); }
  .blank::placeholder { color: #c4c9d4; font-style: italic; font-size: .8em; }
  .blank.correct { border-bottom-color: var(--green); color: var(--green); font-weight: 700; }
  .blank.wrong { border-bottom-color: var(--red); color: var(--red); background: rgba(155,44,44,.06); animation: shake .3s ease; }
  .blank.failed { border-bottom-color: var(--red); color: var(--red); font-weight: 700; background: rgba(155,44,44,.08); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* punct after blank */
  .punct { font-family: 'Lora', serif; font-size: 1rem; color: var(--text); }

  /* ACTION */
  .action-area { margin-top: 28px; padding-top: 22px; border-top: 1.5px dashed var(--border); text-align: center; }
  .submit-btn { display: none; background: var(--navy); color: white; border: none; padding: 14px 40px;
    font-size: 1rem; font-family: inherit; font-weight: 700; border-radius: 8px; cursor: pointer;
    transition: background .2s; letter-spacing: .04em; }
  .submit-btn:hover { background: var(--blue); }
  .submit-btn.visible { display: inline-block; }

  /* SCORE */
  .score-box { background: linear-gradient(135deg, var(--navy), var(--blue)); color: white;
    border-radius: 12px; padding: 32px; text-align: center; margin-bottom: 24px; }
  .score-label { font-size: .9rem; color: rgba(255,255,255,.7); margin-bottom: 8px; }
  .score-num { font-size: 4rem; font-weight: 700; font-family: 'Lora', serif; color: var(--accent);
    line-height: 1; margin-bottom: 8px; }
  .score-detail { font-size: .9rem; color: rgba(255,255,255,.65); }
  .btn-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .btn { padding: 11px 24px; font-size: .93rem; font-family: inherit; font-weight: 700;
    border-radius: 8px; cursor: pointer; border: none; transition: all .2s; letter-spacing: .03em; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--blue); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover { background: #1e543a; }
  .btn-outline { background: white; color: var(--navy); border: 1.5px solid var(--border); }
  .btn-outline:hover { border-color: var(--navy); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #a67c1e; }

  .hidden { display: none !important; }
  .screen { display: none; }
  .screen.active { display: block; }

  @media (max-width: 600px) {
    .main { padding: 20px 16px 60px; }
    .home-header h1 { font-size: 1.5rem; }
    .projects-grid { grid-template-columns: 1fr 1fr; }
    .topbar { padding: 12px 16px; }
    .en-text { font-size: .95rem; line-height: 2.8; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">外贸商函 · 翻译练习（高难版）</div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <button class="home-btn" onclick="goHome()">⌂ 主界面</button>
</div>

<div class="main">
  <div class="screen active" id="screen-home">
    <div class="home-header">
      <h1>外贸商函翻译练习</h1>
      <p>每句仅给出 2–6 个提示词（金色显示），其余单词全部需要独立填写</p>
      <span class="badge">高难版 · 全句翻译</span>
    </div>
    <div class="name-section">
      <label>学生姓名：</label>
      <input type="text" id="studentName" placeholder="请输入姓名">
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </div>

  <div class="screen" id="screen-models">
    <div class="screen-header">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <div class="screen-header-text">
        <h2 id="modelScreenTitle"></h2>
        <p id="modelScreenSub"></p>
      </div>
    </div>
    <div class="models-list" id="modelsList"></div>
  </div>

  <div class="screen" id="screen-exercise">
    <div class="exercise-header">
      <div>
        <div class="ex-title" id="exTitle"></div>
        <div class="ex-meta" id="exMeta"></div>
      </div>
      <div class="progress-pill" id="exProgress"></div>
    </div>
    <div class="hint-legend">
      <span class="legend-hint"><span class="dot"></span>金色 = 提示词（已给出）</span>
      <span class="legend-blank"><span class="dot"></span>下划线 = 需要填写</span>
      <span style="color:var(--muted)">每词独立一格 · 不区分大小写</span>
    </div>
    <div id="exerciseContent"></div>
    <div class="action-area">
      <button class="submit-btn" id="submitBtn" onclick="showScore()">✓ 提交，查看得分</button>
    </div>
  </div>
</div>

<script>
const PROJECTS = {
  "1": {
    name: "项目一  建立业务关系",
    sub: "Establishing Business Relations",
    models: [
      {
        id: "1.1.1", zh: "发送建立贸易关系信函（买方→卖方）", en: "Intro from Buyer",
        sentences: [
          { zh: "敬启者，我方从电子商务平台<b>得知</b>你方公司名称，<b>了解到</b>你方在出口纺织品方面经验丰富。", en: "Dear Sir/Madam, We owe your name to e-business platform, from which we understand that you are well experienced in the export of textiles with service." },
          { zh: "<b>借此</b>机会自我<b>介绍</b>，我方是一家为美国客户购买各种服装、桌布、床单等产品的进口商。", en: "We take this opportunity to introduce ourselves as one of the importers buying various kinds of garments, table cloths, bed sheets, etc., for clients in the USA." },
          { zh: "为了<b>让</b>我方更好地了解你方产品，请<b>寄</b>给我方产品目录和价目表。", en: "In order to let us have a better understanding of your products, would you please send us by return mail catalogues and pricelists of your products?" },
          { zh: "关于我方财务状况和声誉，请向苏格兰皇家银行<b>查询</b>。", en: "Concerning our financial status and reputation, please refer to the Royal Bank of Scotland." },
          { zh: "我方<b>期待</b>不久就<b>收到</b>你方回信。", en: "We anticipate hearing from you in the near future. Your faithfully, Wendy Brown" },
        ]
      },
      {
        id: "1.1.2", zh: "建立贸易关系信函（卖方→买方）", en: "Intro from Seller",
        sentences: [
          { zh: "敬启者，<b>很高兴</b>在2023年美国拉斯维加斯服装展上<b>见到</b>你。", en: "Dear Sirs, Glad to see you at The MAGIC Las Vegas 2023 show." },
          { zh: "我是亚历山大贸易公司的保罗·约翰逊，我方<b>获悉</b>你方<b>是</b>纺织品原料的重要买家。", en: "This is Paul Johnson from Alexander Trading Company. We learned that you are an important buyer of textiles materials." },
          { zh: "我方现<b>写信</b>是希望与你方<b>建立</b>贸易关系。", en: "We are now writing to establish business relations with you." },
          { zh: "我们<b>很荣幸</b>地将自己介绍为纺织行业的主要出口商之一。", en: "We are pleased to introduce ourselves as one of the leading exporters in the line of textile materials." },
          { zh: "我方所有产品均品质优良、价格合理，因此在许多国家<b>享有</b>很高声誉。", en: "All our products are of high quality and reasonable prices, so they enjoy high reputation in many countries." },
          { zh: "为使您对我们的产品有大致了解，我们随函<b>附上</b>一份目录和价目单。", en: "To give you a general idea of our products, we enclose herewith a copy of our catalogue and a pricelist." },
          { zh: "如果你对其中任何一个<b>有</b>兴趣，请<b>告知</b>我们。", en: "If you have interest in any of them, please let us know." },
          { zh: "我们<b>希望</b>尽快<b>收到</b>你方来信。", en: "We hope to hear from you soon. Your faithfully, Paul Johnson" },
        ]
      },
      {
        id: "1.2.1", zh: "回复建立贸易关系信函（卖方）", en: "Reply from Seller",
        sentences: [
          { zh: "亲爱的布朗女士，<b>感谢</b>你方本月5日的来信，我方非常<b>乐意</b>与你方<b>建立</b>贸易关系。", en: "Dear Ms.Brown, Thank you for your letter of 5th this month and we shall be glad to enter into business relations with you." },
          { zh: "我是中国BCD贸易公司的王海伦，凭借多年经验，我们<b>供应</b>各种品质优良、价格合理的纺织品。", en: "This is Helen Wang from BCD Trade Company, China. We supply various textiles of high quality at reasonable prices with many years' experience." },
          { zh: "随函<b>附寄</b>我公司的电子产品目录及价目表，请查收。请<b>联系</b>我方获取更多详细信息。", en: "Enclosed please find an e-catalogue and a pricelist of our products. Please contact us for more details needed." },
          { zh: "关于我方财务状况和声誉，请向中国银行<b>查询</b>。", en: "Concerning our financial status and reputation, please refer to the Bank of China." },
          { zh: "<b>期待</b>早复佳音。", en: "Looking forward to your early and favorable reply. Yours sincerely, Helen Wang" },
        ]
      },
      {
        id: "1.2.2", zh: "回复建立贸易关系信函（买方）", en: "Reply from Buyer",
        sentences: [
          { zh: "我方<b>收到</b>你方2024年2月5日的来函，非常感谢，并<b>高兴</b>地<b>得知</b>你方<b>希望</b>与我方<b>建立</b>业务关系。", en: "Dear Mr.Johnson, We have received with thanks your letter of Feb.05,2024 and are glad to learn that you wish to open an account with us." },
          { zh: "我方<b>从事</b>纺织品进口业务多年。现在，我方正在<b>寻求</b>高品质的人造丝。", en: "We have been the importer of textiles for many years. At present, we are looking for rayon of high quality." },
          { zh: "若蒙你方寄送新样品供我方参考，将不胜<b>感激</b>。", en: "We shall be much obliged if you send us your new samples for our reference." },
          { zh: "如蒙告知，不胜<b>感激</b>。", en: "Your favorable information will be appreciated. Yours faithfully, Helen Wang" },
        ]
      },
      {
        id: "1.3.1", zh: "客户资信调查（向银行查询买方）", en: "Credit Check – Buyer",
        sentences: [
          { zh: "敬启者，我方已<b>收到</b>来自美国拉斯维加斯ABC公司的一个大订单。", en: "Dear Sirs, We have received a large order from ABC Company, Las Vegas, USA." },
          { zh: "你方被<b>推荐</b>为证明银行。若蒙贵方<b>提供</b>上述公司的经营状况信息，我方将不胜<b>感激</b>。", en: "You are referred as the reference bank. We would therefore appreciate it if you would provide us with information about the business standing of the above-mentioned firm." },
          { zh: "劳驾帮我方<b>获得</b>所需的财务状况和其他信息，好吗？", en: "Will you please be good enough to obtain for us the financial standing and other information we need?" },
          { zh: "任何你方<b>提供</b>的信息都将得到严格的<b>保密处理</b>。先行<b>致谢</b>。", en: "Any information that you may provide for us will be treated in strict confidence. Thank you in advance." },
        ]
      },
      {
        id: "1.3.2", zh: "调查潜在客户资信（向银行查询卖方）", en: "Credit Check – Seller",
        sentences: [
          { zh: "敬启者，英国的亚历山大贸易公司已经<b>致函</b>我方，并<b>希望</b>与我方<b>建立</b>贸易关系。", en: "Dear Sirs, Alexander Trading Company in England has written to us that they are the leading supplier of textiles and wish to establish business relations with us." },
          { zh: "因为之前我方与他们从未<b>有过</b>业务往来，对于你们可能<b>提供</b>的任何信息我方都将<b>感激</b>。", en: "As we have no business relations with them before, we should be most grateful for any information you may provide." },
          { zh: "1. 你和这个公司<b>建立</b>业务关系有多长时间了？", en: "1. How long have you been in business relations with this company?" },
          { zh: "2. 他们的信用额度<b>是</b>多少？", en: "2. What is their credit limit in your bank account?" },
          { zh: "3. 他们的产品质量<b>怎么样</b>？先行<b>致谢</b>。", en: "3. How is the quality of their products? Thank you in advance." },
        ]
      },
    ]
  },
  "2": {
    name: "项目二  询盘",
    sub: "Inquiries",
    models: [
      {
        id: "2.1.1", zh: "整理客户询盘信息（买方→卖方）", en: "Inquiry for Costumes",
        sentences: [
          { zh: "亲爱的王女士，感谢你方2月7日的邮件，从信中我们<b>得知</b>你方<b>是</b>各类纺织品的主要出口商。", en: "Dear Ms. Wang, Thank you for your E-mail of Feb.7th, from which we know you are a leading exporter of various textiles." },
          { zh: "目前，女士唐装在美国越来越流行，因此我们<b>考虑</b><b>进口</b>一些。", en: "Chinese costumes for ladies are increasingly popular in America for the time being, so we are considering importing some of them." },
          { zh: "如果你方能航空<b>邮寄</b>整套产品的剪样给我方，我方会很高兴。", en: "We will be glad if you can airmail us some cuttings covering your full range of products." },
          { zh: "同时请<b>提供</b>报价，并告知订单量超过3000件时的折扣。", en: "Meanwhile, quotation as well as discount is needed if the quantity is over 3000 pieces." },
          { zh: "我方<b>期待</b>我们长期的合作。", en: "We anticipate our long-term cooperation. Yours sincerely, Wendy Brown" },
        ]

// ── Tokenizer ─────────────────────────────────────────────────────────
// Split sentence into tokens. Each token: {word, trail, isWord}
// "garments,"  → word:"garments"  trail:","  isWord:true
// "2024,"      → word:"2024"      trail:","  isWord:true (has digits)
// HTML entities like &ldquo; are kept as one unit but flagged non-word
function tokenize(en) {
  const tokens = [];
  // Split preserving spaces; each element is one space-separated token
  const raw = en.split(' ').filter(t => t.length > 0);
  for (const tok of raw) {
    // Strip trailing punctuation into trail
    const m = tok.match(/^(.*?)([.,!?;:)\]]+)?$/);
    const word = m[1] || tok;
    const trail = m[2] || '';
    const isWord = /[a-zA-Z0-9]/.test(word) && !word.startsWith('&');
    tokens.push({ orig: tok, word, trail, isWord });
  }
  return tokens;
}

// Count word-tokens
function wordCount(tokens) {
  return tokens.filter(t => t.isWord).length;
}

// Determine how many hints to show based on word count
function hintCount(wc) {
  if (wc <= 12) return 2;
  if (wc <= 24) return 4;
  return 6;
}

// Select indices (into tokens array) to show as hints
// Strategy: always show first word; distribute rest evenly
function selectHints(tokens, nHints) {
  const wordIdxs = tokens.map((t,i) => t.isWord ? i : -1).filter(i => i >= 0);
  const n = wordIdxs.length;
  if (n <= nHints) return new Set(wordIdxs);
  const chosen = new Set();
  chosen.add(wordIdxs[0]); // always first word
  if (nHints >= 2) {
    // last word too if nHints allows
    chosen.add(wordIdxs[n - 1]);
  }
  // Fill remaining evenly between first and last
  let needed = nHints - chosen.size;
  if (needed > 0) {
    const step = (n - 1) / (nHints - 1);
    for (let i = 1; i < nHints - 1; i++) {
      const pos = Math.round(i * step);
      chosen.add(wordIdxs[Math.min(pos, n - 1)]);
      if (chosen.size >= nHints) break;
    }
  }
  // If still need more, fill sequential
  for (let i = 1; chosen.size < nHints && i < n - 1; i++) {
    chosen.add(wordIdxs[i]);
  }
  return chosen;
}

// ── State ─────────────────────────────────────────────────────────────
const state = {
  name: '',
  currentProject: null,
  currentModel: null,
  attempts: {},
  sessionScores: {},
  submitCounts: {}   // { "modelId": number } — 累计提交次数（含重做）
};

// ── Navigation ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = [];
  if (state.currentProject) {
    parts.push(`<span class="crumb" onclick="showProjectModels('${state.currentProject}')">项目${state.currentProject}</span>`);
    parts.push('<span class="sep">›</span>');
  }
  if (state.currentModel) {
    parts.push(`<span class="active">${state.currentModel.id}</span>`);
  }
  bc.innerHTML = parts.join('');
}

function renderHome() {
  const grid = document.getElementById('projectsGrid');
  grid.innerHTML = '';
  Object.entries(PROJECTS).forEach(([key, proj]) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.onclick = () => startProject(key);
    const done = proj.models.filter(m => state.sessionScores[m.id] !== undefined).length;
    card.innerHTML = `
      <div class="project-count">${done}/${proj.models.length}</div>
      <div class="project-num">项目 ${key}</div>
      <div class="project-name">${proj.name.replace(/^项目\S+\s+/, '')}</div>
      <div class="project-sub">${proj.sub}</div>`;
    grid.appendChild(card);
  });
}

function startProject(pid) {
  const name = document.getElementById('studentName').value.trim();
  if (!name) {
    const el = document.getElementById('studentName');
    el.focus(); el.style.borderColor = '#e53e3e';
    setTimeout(() => el.style.borderColor = '', 2000);
    return;
  }
  state.name = name;
  state.currentProject = pid;
  showProjectModels(pid);
}

function showProjectModels(pid) {
  state.currentProject = pid;
  const proj = PROJECTS[pid];
  document.getElementById('modelScreenTitle').textContent = proj.name;
  document.getElementById('modelScreenSub').textContent = proj.sub + ' — 请选择要练习的课文';
  const list = document.getElementById('modelsList');
  list.innerHTML = '';
  proj.models.forEach(m => {
    const card = document.createElement('div');
    card.className = 'model-card';
    card.onclick = () => startExercise(pid, m.id);
    const sc = state.sessionScores[m.id];
    const badge = sc !== undefined ? `<span class="model-score-badge">✓ ${Math.round(sc)}分</span>` : '';
    card.innerHTML = `
      <span class="model-id">${m.id}</span>
      <div class="model-title-text">
        <div class="model-title-zh">${m.zh}</div>
        <div class="model-title-en">${m.en}</div>
      </div>
      ${badge}
      <span class="model-arrow">›</span>`;
    list.appendChild(card);
  });
  updateBreadcrumb();
  showScreen('models');
}

function goHome() {
  state.currentModel = null;
  updateBreadcrumb();
  renderHome();
  showScreen('home');
}

// ── Exercise ──────────────────────────────────────────────────────────
function startExercise(pid, mid) {
  const proj = PROJECTS[pid];
  const model = proj.models.find(m => m.id === mid);
  state.currentProject = pid;
  state.currentModel = model;
  state.attempts = {};
  renderExercise(model);
  updateBreadcrumb();
  showScreen('exercise');
}

function renderExercise(model) {
  document.getElementById('exTitle').textContent = model.id + '  ' + model.zh;
  document.getElementById('exMeta').textContent = PROJECTS[state.currentProject].name;

  // Count total blanks
  let totalBlanks = 0;
  model.sentences.forEach(s => {
    const tokens = tokenize(s.en);
    const wc = wordCount(tokens);
    const nh = hintCount(wc);
    const hints = selectHints(tokens, nh);
    totalBlanks += tokens.filter((t, i) => t.isWord && !hints.has(i)).length;
  });
  document.getElementById('exProgress').textContent = `共 ${totalBlanks} 个填空`;

  const content = document.getElementById('exerciseContent');
  content.innerHTML = '';

  // Rebuild action area
  const actionArea = document.querySelector('.action-area');
  actionArea.innerHTML = '<button class="submit-btn" id="submitBtn" onclick="showScore()">✓ 提交，查看得分</button>';

  model.sentences.forEach((sent, sIdx) => {
    const block = document.createElement('div');
    block.className = 'sentence-block';

    // Chinese hint
    const hint = document.createElement('div');
    hint.className = 'zh-hint';
    hint.innerHTML = sent.zh;
    block.appendChild(hint);

    // Tokenize English
    const tokens = tokenize(sent.en);
    const wc = wordCount(tokens);
    const nh = hintCount(wc);
    const hintSet = selectHints(tokens, nh);

    const enDiv = document.createElement('div');
    enDiv.className = 'en-text';

    let bIdx = 0;
    tokens.forEach((tok, tIdx) => {
      if (!tok.isWord) {
        // Non-word token (e.g. HTML entity, punctuation-only): show as text
        enDiv.appendChild(document.createTextNode(tok.orig + ' '));
        return;
      }

      if (hintSet.has(tIdx)) {
        // Show as hint word
        const span = document.createElement('span');
        span.className = 'hint-word';
        span.textContent = tok.word;
        enDiv.appendChild(span);
        if (tok.trail) {
          enDiv.appendChild(document.createTextNode(tok.trail));
        }
        enDiv.appendChild(document.createTextNode(' '));
      } else {
        // Blank input
        const id = `${sIdx}-${bIdx}`;
        const answer = tok.word;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'blank';
        input.id = 'b-' + id;
        input.autocomplete = 'off';
        input.autocorrect = 'off';
        input.spellcheck = false;
        // Width based on answer length
        input.style.width = Math.max(42, answer.length * 11) + 'px';
        input.dataset.answer = answer;

        input.addEventListener('blur', () => checkBlank(id, answer));
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { checkBlank(id, answer); e.preventDefault(); }
        });
        input.addEventListener('input', () => {
          input.classList.remove('wrong');
          checkAllFilled();
        });

        enDiv.appendChild(input);
        if (tok.trail) {
          const pt = document.createElement('span');
          pt.className = 'punct';
          pt.textContent = tok.trail;
          enDiv.appendChild(pt);
        }
        enDiv.appendChild(document.createTextNode(' '));
        bIdx++;
      }
    });

    block.appendChild(enDiv);
    content.appendChild(block);
  });
}

// ── Checking ──────────────────────────────────────────────────────────
function checkBlank(id, answer) {
  const input = document.getElementById('b-' + id);
  if (!input || input.disabled) return;
  const val = input.value.trim();
  if (!val) return;
  if (input.classList.contains('correct')) return;

  if (!state.attempts[id]) state.attempts[id] = 0;

  if (val.toLowerCase() === answer.toLowerCase()) {
    input.classList.remove('hinted', 'wrong');
    input.classList.add('correct');
    input.disabled = true;
    checkAllFilled();
  } else {
    state.attempts[id]++;
    if (state.attempts[id] >= 3) {
      input.value = answer;
      input.disabled = true;
      input.classList.remove('wrong');
      input.classList.add('failed');
      checkAllFilled();
    } else {
      input.classList.remove('wrong');
      void input.offsetWidth;
      input.classList.add('wrong');
      if (state.attempts[id] === 2) {
        const hint = answer.length > 2
          ? answer[0] + '_'.repeat(answer.length - 2) + answer[answer.length - 1]
          : answer[0] + '_';
        input.placeholder = hint;
      }
      input.value = '';
      input.focus();
    }
  }
}

function checkAllFilled() {
  const blanks = document.querySelectorAll('.blank');
  const btn = document.getElementById('submitBtn');
  if (blanks.length === 0 || !btn) return;
  if (Array.from(blanks).every(b => b.disabled)) btn.classList.add('visible');
}

// ── Score ─────────────────────────────────────────────────────────────
// ── Submit score to QuickForm ─────────────────────────────────────────
async function submitToQuickForm(data) {
  const ENDPOINT = 'https://quickform.cn/api/32e1mh4epq';
  try {
    const res = await fetch(ENDPOINT, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(data)
    });
    return res.ok ? 'ok' : 'fail';
  } catch (e) {
    return 'error';
  }
}

function showScore() {
  const blanks = document.querySelectorAll('.blank');
  let total = blanks.length, failed = 0;
  blanks.forEach(b => { if (b.classList.contains('failed')) failed++; });
  const score = total === 0 ? 100 : Math.round(((total - failed) / total) * 100);
  state.sessionScores[state.currentModel.id] = score;

  // Increment submit counter for this model
  const mid = state.currentModel.id;
  state.submitCounts[mid] = (state.submitCounts[mid] || 0) + 1;
  const attempt = state.submitCounts[mid];

  // Timestamp (local time, formatted as YYYY-MM-DD HH:MM:SS)
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const submitted_at = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} `
                     + `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  const proj      = PROJECTS[state.currentProject];
  const midx      = proj.models.findIndex(m => m.id === mid);
  const nextModel = midx < proj.models.length - 1 ? proj.models[midx + 1] : null;
  const grade     = score >= 90 ? '优秀 🌟' : score >= 75 ? '良好 👍' : score >= 60 ? '及格 📝' : '继续加油 💪';

  const actionArea = document.querySelector('.action-area');

  actionArea.innerHTML = `
    <div class="score-box">
      <div class="score-label">${mid} 得分（第 ${attempt} 次提交）</div>
      <div class="score-num">${score}</div>
      <div class="score-detail">${grade} &nbsp;|&nbsp; 共 ${total} 空，答错 ${failed} 处</div>
    </div>
    <div id="submitStatus" style="
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:.85rem; color:var(--muted); margin-bottom:14px;">
      <span id="submitIcon" style="font-size:1rem">⏳</span>
      <span id="submitMsg">正在提交成绩记录…</span>
    </div>
    <p style="color:var(--muted);font-size:.83rem;margin-bottom:16px;">
      红色单词为系统自动填写（答错3次），不计入得分。
    </p>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="retryExercise()">↺ 重做</button>
      <button class="btn btn-primary" onclick="showProjectModels('${state.currentProject}')">← 返回列表</button>
      ${nextModel
        ? `<button class="btn btn-success" onclick="startExercise('${state.currentProject}','${nextModel.id}')">下一篇 › (${nextModel.id})</button>`
        : `<button class="btn btn-accent" onclick="showProjectModels('${state.currentProject}')">✓ 全部完成</button>`}
    </div>`;

  // Build full payload
  const payload = {
    student_name:  state.name,
    model_id:      mid,
    score:         score,
    attempt:       attempt,
    total_blanks:  total,
    wrong_count:   failed,
    submitted_at:  submitted_at
  };

  // Fire POST in background, update status indicator when done
  submitToQuickForm(payload).then(result => {
    const icon = document.getElementById('submitIcon');
    const msg  = document.getElementById('submitMsg');
    if (!icon || !msg) return;
    if (result === 'ok') {
      icon.textContent = '✅';
      msg.textContent  = `已记录：${state.name} · ${mid} · ${score}分 · 第${attempt}次 · ${submitted_at}`;
      msg.style.color  = 'var(--green)';
    } else {
      icon.textContent = '⚠️';
      msg.textContent  = '成绩提交失败，请检查网络连接';
      msg.style.color  = 'var(--red)';
    }
  });
}

function retryExercise() {
  state.attempts = {};
  renderExercise(state.currentModel);
  window.scrollTo({ top: 0 });
}

// ── Init ──────────────────────────────────────────────────────────────
renderHome();
</script>
